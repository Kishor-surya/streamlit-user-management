name: Publish Metrics to GitHub Pages

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=db --cov=utils \
                 --cov-report=xml --cov-report=html --cov-report=term-missing \
                 --junitxml=test-results.xml

      - name: Fetch CodeQL alert metrics
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let alerts = [];
            try {
              alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
              });
            } catch (err) {
              core.warning(`Could not fetch CodeQL alerts: ${err.message}`);
            }
            const bySeverity = {};
            for (const a of alerts) {
              const sev = (a.rule && (a.rule.security_severity_level || a.rule.severity)) || 'unknown';
              bySeverity[sev] = (bySeverity[sev] || 0) + 1;
            }
            fs.writeFileSync('codeql-metrics.json', JSON.stringify({ total: alerts.length, bySeverity }, null, 2));

      - name: Fetch Dependabot alert metrics
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let alerts = [];
            try {
              alerts = await github.paginate(github.rest.dependabot.listAlertsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
              });
            } catch (err) {
              core.warning(`Could not fetch Dependabot alerts: ${err.message}`);
            }
            const bySeverity = {};
            for (const a of alerts) {
              const sev = (a.security_advisory && a.security_advisory.severity) || 'unknown';
              bySeverity[sev] = (bySeverity[sev] || 0) + 1;
            }
            fs.writeFileSync('dependabot-metrics.json', JSON.stringify({ total: alerts.length, bySeverity }, null, 2));

      - name: Build dashboard site
        run: python scripts/build_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
