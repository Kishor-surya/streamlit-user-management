name: User Management Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: user-management-request
  cancel-in-progress: false

jobs:
  process:
    name: Process user request issue
    if: contains(github.event.issue.labels.*.name, 'user-management-request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests

      - name: Process issue request
        id: process
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/process_user_issue.py

      - name: Commit queued changes
        if: steps.process.outputs.changed == 'true'
        run: |
          git config user.name "peopledesk-bot"
          git config user.email "actions@github.com"
          git add data/inbox/pending_add.csv data/inbox/pending_delete.csv
          git commit -m "Queue user request from issue #${{ github.event.issue.number }}"
          git push origin HEAD:main

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('issue_comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Close issue on success
        if: steps.process.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
